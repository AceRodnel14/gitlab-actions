# Release jobs of templates/app.yml (test build, image push, GitHub sync, cleanup):
# only the default branch and the release tags latest, vX.Y, vX.Y.Z.
# Lint/test jobs use jobs/lint.yml rules with LINT_ON_BRANCHES / LINT_ON_DEFAULT_BRANCH.
.app_on_release:
  rules:
    - !reference [.never_on_github_sync, rules]
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG == "latest" || $CI_COMMIT_TAG =~ /^v\d+\.\d+(\.\d+)?$/'
