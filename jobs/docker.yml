.docker_cleanup:
  script:
    - echo "Cleaning up Docker unused data..."
    - docker system prune -af --volumes
  tags:
    - shell

.docker_validate_build:
  script:
    - docker build --check .
  tags:
    - shell

.docker_validate_compose_file:
  script:
    - |
      if [ -f docker-compose.yml ]; then
        docker compose config && echo "OK" || (echo "ERROR" && exit 1)
      else
        echo "No docker-compose.yml found, skipping"
      fi
  tags:
    - shell

.docker_login_gitlab:
  before_script:
    - echo "${CI_REGISTRY_PASSWORD}" | docker login ${CI_REGISTRY} -u "${CI_REGISTRY_USER}" --password-stdin
    - |
      DATE=$(date +"%y%m%d%H%M%S")
      TAGS=(
        "${CI_COMMIT_BRANCH}"
      )
    - IMAGE_NAME="${CI_REGISTRY_IMAGE}"
  after_script:
    - docker logout

.docker_login_dockerhub:
  before_script:
    - echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USER}" --password-stdin
    - |
      DATE=$(date +"%y%m%d%H%M%S")
      TAGS=(
        "${CI_COMMIT_BRANCH}-${DATE}"
        "${CI_COMMIT_BRANCH}"
      )
    - IMAGE_NAME="$(echo ${DOCKERHUB_USER} | tr '[:upper:]' '[:lower:]')/${CI_PROJECT_NAME}"
  after_script:
    - docker logout

.docker_login_ghcr:
  before_script:
    - echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_SPACE}" --password-stdin
    - |
      DATE=$(date +"%y%m%d%H%M%S")
      TAGS=(
        "${CI_COMMIT_BRANCH}-${DATE}"
        "${CI_COMMIT_BRANCH}"
      )
    - IMAGE_NAME="ghcr.io/$(echo ${GITHUB_SPACE} | tr '[:upper:]' '[:lower:]')/${CI_PROJECT_NAME}"
  after_script:
    - docker logout

.docker_build_container:
  script:
    - |
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        echo "Tag detected: $CI_COMMIT_TAG"
        echo "Processing: $IMAGE_NAME:$CI_COMMIT_TAG"
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          -t $IMAGE_NAME:$CI_COMMIT_TAG \
          --push .
      else
        echo "No tag — branch pipeline"
        for TAG in "${TAGS[@]}"; do
          echo "Processing: $IMAGE_NAME:$TAG"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t $IMAGE_NAME:$TAG \
            --push .
        done
      fi
  tags:
    - shell