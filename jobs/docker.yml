.docker_cleanup:
  script:
    - echo "Cleaning up Docker unused data..."
    - docker system prune -af --volumes
  tags:
    - shell

.docker_validate_build:
  script:
    - docker build --check .
  tags:
    - shell

.docker_validate_compose_file:
  script:
    - |
      if [ -f docker-compose.yml ]; then
        docker compose config && echo "OK" || (echo "ERROR" && exit 1)
      else
        echo "No docker-compose.yml found, skipping"
      fi
  tags:
    - shell

.docker_login_gitlab:
  before_script:
    - echo "${CI_REGISTRY_PASSWORD}" | docker login ${CI_REGISTRY} -u "${CI_REGISTRY_USER}" --password-stdin
    - |
      DATE=$(date +"%y%m%d%H%M%S")
      TAGS=(
        "${CI_COMMIT_BRANCH}"
      )
    - IMAGE_NAME="${CI_REGISTRY_IMAGE}"
  after_script:
    - docker logout

.docker_login_dockerhub:
  before_script:
    - echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USER}" --password-stdin
    - |
      DATE=$(date +"%y%m%d%H%M%S")
      TAGS=(
        "${CI_COMMIT_BRANCH}-${DATE}"
        "${CI_COMMIT_BRANCH}"
      )
    - IMAGE_NAME="$(echo ${DOCKERHUB_USER} | tr '[:upper:]' '[:lower:]')/${CI_PROJECT_NAME}"
  after_script:
    - docker logout

# Sets the Docker Hub repository's full description from dockerdesc.md (app repo root).
# Skips (exit 0) without the file or when it exceeds 25000 bytes; never truncates.
# Auth: POST /v2/auth/token (PAT in DOCKERHUB_TOKEN) -> Bearer JWT, per the Docker Hub
# API spec. The update uses the undocumented PATCH /v2/repositories/<ns>/<repo>/
# (as peter-evans/dockerhub-description does). UNVERIFIED: that this PATCH accepts the
# auth/token JWT, and which PAT scope it needs (likely Read, Write, Delete).
# allow_failure: a failed description must never fail the pipeline.
.dockerhub_description:
  image: alpine:3.24
  tags:
    - docker
  allow_failure: true
  script:
    - |
      if [ ! -f dockerdesc.md ]; then echo "No dockerdesc.md, skipping"; exit 0; fi
      SIZE=$(wc -c < dockerdesc.md)
      if [ "$SIZE" -gt 25000 ]; then echo "WARNING: dockerdesc.md is ${SIZE} bytes (max 25000), skipping"; exit 0; fi
      apk add --no-cache curl jq > /dev/null
      NS=$(printf '%s' "${DOCKERHUB_USER}" | tr '[:upper:]' '[:lower:]')
      API="https://hub.docker.com/v2"
      WORK=$(mktemp -d)
      trap 'rm -rf "$WORK"' EXIT
      if ! jq -n --arg u "${DOCKERHUB_USER}" --arg s "${DOCKERHUB_TOKEN}" '{identifier: $u, secret: $s}' |
        curl -sS --fail-with-body -o "$WORK/auth.json" -w '%{http_code}' -X POST \
          -H "Content-Type: application/json" --data @- "${API}/auth/token" > "$WORK/auth.status"; then
        echo "Docker Hub login failed (HTTP $(cat "$WORK/auth.status")):"; cat "$WORK/auth.json"; exit 1
      fi
      echo "Docker Hub login: HTTP $(cat "$WORK/auth.status")"
      umask 077
      printf 'Authorization: Bearer %s\n' "$(jq -r .access_token "$WORK/auth.json")" > "$WORK/auth.header"
      if ! jq -n --rawfile d dockerdesc.md '{full_description: $d}' |
        curl -sS --fail-with-body -o "$WORK/patch.json" -w '%{http_code}' -X PATCH \
          -H "Content-Type: application/json" -H @"$WORK/auth.header" --data @- \
          "${API}/repositories/${NS}/${CI_PROJECT_NAME}/" > "$WORK/patch.status"; then
        echo "Updating the description of ${NS}/${CI_PROJECT_NAME} failed (HTTP $(cat "$WORK/patch.status")):"; cat "$WORK/patch.json"; exit 1
      fi
      echo "Updated the description of ${NS}/${CI_PROJECT_NAME}: HTTP $(cat "$WORK/patch.status")"


.docker_login_ghcr:
  before_script:
    - echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_SPACE}" --password-stdin
    - |
      DATE=$(date +"%y%m%d%H%M%S")
      TAGS=(
        "${CI_COMMIT_BRANCH}-${DATE}"
        "${CI_COMMIT_BRANCH}"
      )
    - IMAGE_NAME="ghcr.io/$(echo ${GITHUB_SPACE} | tr '[:upper:]' '[:lower:]')/${CI_PROJECT_NAME}"
  after_script:
    - docker logout

.docker_build_container:
  script:
    - |
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        echo "Tag detected: $CI_COMMIT_TAG"
        echo "Processing: $IMAGE_NAME:$CI_COMMIT_TAG"
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          -t $IMAGE_NAME:$CI_COMMIT_TAG \
          --push .
      else
        echo "No tag — branch pipeline"
        for TAG in "${TAGS[@]}"; do
          echo "Processing: $IMAGE_NAME:$TAG"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t $IMAGE_NAME:$TAG \
            --push .
        done
      fi
  tags:
    - shell

.docker_build_container_amd64_only:
  script:
    - |
      if [[ -n "$CI_COMMIT_TAG" ]]; then
        echo "Tag detected: $CI_COMMIT_TAG"
        echo "Processing: $IMAGE_NAME:$CI_COMMIT_TAG"
        docker build -t $IMAGE_NAME:$CI_COMMIT_TAG .
        docker push $IMAGE_NAME:$CI_COMMIT_TAG
      else
        echo "No tag — branch pipeline"
        for TAG in "${TAGS[@]}"; do
          echo "Processing: $IMAGE_NAME:$TAG"
          docker build -t $IMAGE_NAME:$TAG .
          docker push $IMAGE_NAME:$TAG
        done
      fi
  tags:
    - shell