.dont_run_when_github_sync_and_tagged:
  rules:
    # ===== Prevent GitLab ↔ GitHub loop =====
    - if: '$CI_COMMIT_MESSAGE =~ /^.SyncWithGitHub/'
      when: never
    # ===== Skip ai/ branches =====
    - if: '$CI_COMMIT_BRANCH =~ /^ai\//'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      when: on_success
    # ===== Release tags: latest, vX.Y or vX.Y.Z only =====
    - if: '$CI_COMMIT_TAG == "latest" || $CI_COMMIT_TAG =~ /^v\d+\.\d+(\.\d+)?$/'
      when: on_success
    - when: never

.dont_run_when_github_sync:
  rules:
    # ===== Prevent GitLab ↔ GitHub loop =====
    - if: '$CI_COMMIT_MESSAGE =~ /^.SyncWithGitHub/'
      when: never
    # ===== Skip ai/ branches =====
    - if: '$CI_COMMIT_BRANCH =~ /^ai\//'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      when: on_success
    # ===== Release tags: latest, vX.Y or vX.Y.Z only =====
    - if: '$CI_COMMIT_TAG == "latest" || $CI_COMMIT_TAG =~ /^v\d+\.\d+(\.\d+)?$/'
      when: on_success
    - when: never