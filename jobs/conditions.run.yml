.dont_run_when_github_sync_and_tagged:
  rules:
    # ===== Prevent GitLab ↔ GitHub loop =====
    - if: '$CI_COMMIT_MESSAGE =~ /^.SyncWithGitHub/'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      when: on_success
    - if: '$CI_COMMIT_TAG == "latest"'
      when: on_success
    - when: never

.dont_run_when_github_sync:
  rules:
    # ===== Prevent GitLab ↔ GitHub loop =====
    - if: '$CI_COMMIT_MESSAGE =~ /^.SyncWithGitHub/'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      when: on_success
    - if: '$CI_COMMIT_TAG == "latest"'
      when: on_success
    - when: never