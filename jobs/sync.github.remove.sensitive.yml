.sync_to_github_remove_sensitive:
  image: alpine:latest
  before_script:
    - apk add --no-cache git rsync
    - git config --global user.email "$GITHUB_EMAIL"
    - git config --global user.name "$GITHUB_USERNAME"
  script:
    # ===== Prepare workspace =====
    - pwd
    - rm -rf work
    - mkdir -p work
    - cd work
    - echo "$CI_PROJECT_NAME"
    - echo "$CI_COMMIT_REF_NAME"
    # ===== Clone GitLab repo (lab) =====
    - git clone "$CI_REPOSITORY_URL" lab
    - cd lab
    - git checkout "$CI_COMMIT_REF_NAME"
    - cd ..
    # ===== Clone GitHub repo (hub) =====
    - git clone https://$GITHUB_USERNAME:$GITHUB_TOKEN@github.com/$GITHUB_SPACE/$CI_PROJECT_NAME.git hub
    - cd hub
    - git fetch origin
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Tag: start from the GitHub commit synced from the tagged commit, else detach from the default branch
        SYNCED=$(git log --all -F --grep="[SyncWithGitLab $CI_COMMIT_SHORT_SHA]" --format=%H -1)
        git checkout --detach "${SYNCED:-origin/HEAD}"
      else
        git checkout "$CI_COMMIT_REF_NAME" 2>/dev/null || git checkout --track "origin/$CI_COMMIT_REF_NAME" 2>/dev/null || git checkout -b "$CI_COMMIT_REF_NAME"
      fi
    - cd ..
    # ===== Sync files lab → hub =====
    - rsync -av --checksum --delete --exclude='.git' lab/ hub/
    # ===== Commit & push to GitHub =====
    - cd hub
    - mv -f gitignore .gitignore
    - ./.substitute.sh
    - git status
    - |
      if git status --porcelain | grep .; then
        git add .
        git commit -m "[SyncWithGitLab $CI_COMMIT_SHORT_SHA] ${CI_COMMIT_MESSAGE%%$'\n'*}"
        CHANGED=true
      fi
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Tags point at the GitHub commit; GitLab commits (and their history) never leave GitLab
        if [ -n "$CI_COMMIT_TAG_MESSAGE" ]; then
          git tag -f -a "$CI_COMMIT_TAG" -m "$CI_COMMIT_TAG_MESSAGE"
        else
          git tag -f "$CI_COMMIT_TAG"
        fi
        git push --force origin "refs/tags/$CI_COMMIT_TAG"
      elif [ "$CHANGED" = true ]; then
        git push --force-with-lease origin "$CI_COMMIT_REF_NAME"
      else
        echo "No changes to sync."
      fi
  tags:
    - docker