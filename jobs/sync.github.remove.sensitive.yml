.sync_to_github_remove_sensitive:
  image: alpine:latest
  before_script:
    - apk add --no-cache git rsync
    - git config --global user.email "$GITHUB_EMAIL"
    - git config --global user.name "$GITHUB_USERNAME"
  script:
    # ===== Prepare workspace =====
    - mkdir -p work
    - cd work
    # ===== Clone GitLab repo (lab) =====
    - git clone "$CI_REPOSITORY_URL" lab
    - cd lab
    - git checkout "$CI_COMMIT_REF_NAME"
    - cd ..
    # ===== Clone GitHub repo (hub) =====
    - git clone https://$GITHUB_USERNAME:$GITHUB_TOKEN@github.com/$GITHUB_SPACE/$CI_PROJECT_NAME.git hub
    - cd hub
    - git checkout -B "$CI_COMMIT_REF_NAME" || git checkout -b "$CI_COMMIT_REF_NAME"
    - cd ..
    # ===== Sync files lab → hub =====
    - rsync -av --delete --exclude='.git' lab/ hub/
    # ===== Commit & push to GitHub =====
    - cd hub
    - mv -f gitignore .gitignore
    - ./.substitute.sh
    - git status
    - |
      if git status --porcelain | grep .; then
        git add .
        git commit -m "[SyncWithGitLab] Sync from GitLab commit $CI_COMMIT_SHORT_SHA"
        git push origin "$CI_COMMIT_REF_NAME"
      else
        echo "No changes to sync."
      fi
  tags:
    - docker