# Lint + tests for app repos. Every job skips itself when the repo has no matching files.
# Runs on merge requests (incl. ai/ branches) and the default branch.
include:
  - local: jobs/conditions.merge_request.yml
  - local: jobs/lint.yml

stages:
  - validate

lint_python:
  extends: .lint_python

test_python:
  extends: .test_python

lint_go:
  extends: .lint_go

test_go:
  extends: .test_go

lint_node:
  extends: .lint_node

lint_dockerfile:
  extends: .lint_dockerfile

lint_shell:
  extends: .lint_shell

lint_yaml:
  extends: .lint_yaml

lint_opentofu:
  extends: .lint_opentofu

lint_secrets:
  extends: .lint_secrets

lint_claude_plugin:
  extends: .lint_claude_plugin
